<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumière Dental Studio — Beautiful Smiles. Exceptional Care.</title>
    <meta
      name="description"
      content="Lumière Dental Studio — Experience modern dentistry, personalized treatments, and compassionate care designed to keep your smile healthy and beautiful. (Fictional Demonstration Website)"
    />
    <meta property="og:title" content="Lumière Dental Studio — Beautiful Smiles. Exceptional Care." />
    <meta
      property="og:description"
      content="Experience modern dentistry, personalized treatments, and compassionate care designed to keep your smile healthy and beautiful."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('lumiere-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8F7F3] text-[#252A2B] dark:bg-[#0C1E21] dark:text-[#E3EAEB] antialiased transition-colors duration-300 selection:bg-[#183E43] selection:text-[#F8F7F3] dark:selection:bg-[#D2B47A] dark:selection:text-[#183E43]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
